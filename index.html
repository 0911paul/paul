<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragebogen Anbauverein</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script>
    function toggleFollowUp(id, show) {
      document.getElementById(id).style.display = show ? 'block' : 'none';
    }
  </script>
</head>
<body class="bg-gray-50 p-6">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-6">Technischer Fragebogen – Anbauverein</h1>

    <form class="space-y-6">

      <!-- Projektname -->
      <div>
        <label class="block font-semibold mb-1">Projekt- oder Vereinsname</label>
        <input type="text" class="w-full border p-2 rounded" placeholder="z. B. Cannabisverein Nord">
      </div>

      <!-- Immobilie vorhanden -->
      <div>
        <label class="block font-semibold mb-1">Ist die Immobilie bereits vorhanden?</label>
        <div class="space-x-4">
          <label><input type="radio" name="immobilie" onclick="toggleFollowUp('immobilieDetails', true)"> Ja</label>
          <label><input type="radio" name="immobilie" onclick="toggleFollowUp('immobilieDetails', false)"> Nein</label>
        </div>
      </div>

      <!-- Immobilie Details -->
      <div id="immobilieDetails" style="display:none;">
        <div class="mt-4">
          <label class="block font-semibold mb-1">Adresse</label>
          <input type="text" class="w-full border p-2 rounded">
        </div>
        <div class="mt-4">
          <label class="block font-semibold mb-1">Gebäudetyp</label>
          <select class="w-full border p-2 rounded">
            <option>Halle</option>
            <option>Wohnhaus</option>
            <option>Mischobjekt</option>
            <option>Sonstiges</option>
          </select>
        </div>
      </div>

      <!-- Deckenhöhe -->
      <div>
        <label class="block font-semibold mb-1">Deckenhöhe (in Metern)</label>
        <input type="number" step="0.1" class="w-full border p-2 rounded">
      </div>

      <!-- Strom vorhanden -->
      <div>
        <label class="block font-semibold mb-1">Stromanschluss vorhanden?</label>
        <div class="space-x-4">
          <label><input type="radio" name="strom" onclick="toggleFollowUp('stromDetails', true)"> Ja</label>
          <label><input type="radio" name="strom" onclick="toggleFollowUp('stromDetails', false)"> Nein</label>
        </div>
      </div>

      <!-- Strom Details -->
      <div id="stromDetails" style="display:none;">
        <div class="mt-4">
          <label class="block font-semibold mb-1">Verfügbare Leistung (kW)</label>
          <input type="number" class="w-full border p-2 rounded">
        </div>
      </div>

      <!-- Anzahl IGCs -->
      <div>
        <label class="block font-semibold mb-1">Anzahl geplanter IGCs</label>
        <input type="number" class="w-full border p-2 rounded">
      </div>

      <!-- IGC Größe Standard? -->
      <div>
        <label class="block font-semibold mb-1">Standard IGC-Größe 5 × 10 m ausreichend?</label>
        <div class="space-x-4">
          <label><input type="radio" name="igcsize" onclick="toggleFollowUp('customIGC', false)"> Ja</label>
          <label><input type="radio" name="igcsize" onclick="toggleFollowUp('customIGC', true)"> Nein</label>
        </div>
      </div>

      <!-- Custom IGC Größe -->
      <div id="customIGC" style="display:none;">
        <label class="block font-semibold mb-1 mt-4">Wunschgröße (L × B in m)</label>
        <input type="text" class="w-full border p-2 rounded" placeholder="z. B. 6 × 8 m">
      </div>

      <!-- CO2-Begasung -->
      <div>
        <label class="block font-semibold mb-1">Soll CO₂-Begasung integriert werden?</label>
        <div class="space-x-4">
          <label><input type="radio" name="co2"> Ja</label>
          <label><input type="radio" name="co2"> Nein</label>
        </div>
      </div>

      <!-- Submit -->
      <div class="mt-6">
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Absenden</button>
      </div>

    </form>
  </div>
</body>
</html>
